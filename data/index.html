<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tischsteuerung</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="label">Aktuelle Höhe</div>
      <div class="height"><span id="h">--</span> cm</div>
      <div id="mode" class="sub">Modus: -</div>
      <div class="row">
        <button id="btnUp">▲ Hoch</button>
        <button id="btnDown">▼ Runter</button>
        <button class="danger" id="btnStop">Stopp</button>
        <button id="btnZero">Nullpunkt (Zero)</button>
      </div>
    </section>

    <section class="card">
      <h2>Position speichern</h2>
      <div class="row">
        <select id="u">
          <option value="0">Beco (User 0)</option>
          <option value="1">Aybala (User 1)</option>
        </select>
        <select id="p">
          <option value="0">Slot 1</option>
          <option value="1">Slot 2</option>
          <option value="2">Slot 3</option>
        </select>
        <input id="name" type="text" placeholder="Name (z.B. Stehen)" />
        <button class="primary" id="btnSave">Aktuelle Höhe speichern</button>
      </div>
    </section>

    <section class="card">
      <h2>Gespeicherte Positionen</h2>
      <div id="presets"></div>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
